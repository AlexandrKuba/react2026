<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../style.css" />
    <title>React JSX UserCard</title>
    <!-- Підключаємо React -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <!-- Підключаємо ReactDOM -->
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <!-- Babel для підтримки JSX -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  </head>
  <body>
    <p>
      Задача 3. Задано початок та кінець діапазону. При натисканні на кнопку
      випадковим чином генерувати значення з вказаного діапазону та відображати
      його.
    </p>
    <div id="root"></div>

    <script type="text/babel">
      function RendomNumber() {
        const [minNum, setMinNum] = React.useState(1);
        const [maxNum, setMaxNum] = React.useState(100);
        const [randomNum, setRandomNum] = React.useState(0);
        function creatRandomNum() {
          setRandomNum(
            Math.floor(Math.random() * (maxNum - minNum + 1)) + minNum,
          );
        }
        return (
          <div>
            <div style={{ display: "flex", flexDirection: "column" }}>
              <label>
                Введіть мінімальне значення
                <input
                  type="number"
                  value={minNum}
                  onChange={(e) => {
                    setMinNum(Number(e.target.value));
                  }}
                />
              </label>
              <label>
                Введіть максимальне значення
                <input
                  type="number"
                  value={maxNum}
                  onChange={(e) => {
                    setMaxNum(Number(e.target.value));
                  }}
                />
              </label>
              <button
                type="button"
                onClick={creatRandomNum}
                style={{ maxWidth: "300px" }}
              >
                Згенерувати випадкове число
              </button>
            </div>
            <p>Згенероване число - {randomNum}</p>
          </div>
        );
      }

      // Головний компонент App
      function App() {
        return <RendomNumber />;
      }

      // Отримуємо DOM-елемент з id="root"
      const root = ReactDOM.createRoot(document.getElementById("root"));

      // Рендеримо компонент App у елемент root
      root.render(React.createElement(App));
    </script>
  </body>
</html>
