<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../style.css" />
    <title>React JSX UserCard</title>
    <!-- Підключаємо React -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <!-- Підключаємо ReactDOM -->
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <!-- Babel для підтримки JSX -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  </head>
  <body>
    <p>
      Задача 5. Додаток містить масив об’єктів (логін, пароль) -- існуючі логіни
      і паролі. Користувач вводить логін і пароль, а програма при натисненні на
      кнопку повідомляє чи може користувач бути авторизованим.
    </p>
    <div id="root"></div>

    <script type="text/babel">
      function MonthWeather() {
        const [login, setLogin] = React.useState("");
        const [pass, setPass] = React.useState("");
        const [answerForUser, setAnswerForUser] = React.useState("");
        const usersData = [
          { login: "login", password: "password" },
          { login: "qwerty", password: "123" },
          { login: "Ivan", password: "MyPass" },
          { login: "Olga", password: "IHavPass" },
        ];
        function checkUser() {
          for (const user of usersData) {
            if (login === user.login && pass === user.password) {
              setAnswerForUser("Доступ дозвалено");
              break;
            } else
              setAnswerForUser(
                "Доступ не дозволено (не коректний логын або пароль)",
              );
          }
        }
        return (
          <div>
            <div style={{ display: "flex", flexDirection: "column" }}>
              <label>
                Login:
                <input
                  type="text"
                  onChange={(e) => {
                    setLogin(e.target.value);
                  }}
                />
              </label>
              <label>
                Password:
                <input
                  type="password"
                  onChange={(e) => {
                    setPass(e.target.value);
                  }}
                />
              </label>
              <button
                type="button"
                onClick={checkUser}
                style={{ maxWidth: "300px" }}
              >
                Go
              </button>
            </div>
            <p>{answerForUser}</p>
          </div>
        );
      }

      // Головний компонент App
      function App() {
        return <MonthWeather />;
      }

      // Отримуємо DOM-елемент з id="root"
      const root = ReactDOM.createRoot(document.getElementById("root"));

      // Рендеримо компонент App у елемент root
      root.render(React.createElement(App));
    </script>
  </body>
</html>
